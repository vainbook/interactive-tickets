<style>
/* Layout: a ticket counter on a cutting mat. Play view = two mirrored halves, each holding one swipeable ticket;
   the strip between them is a punch card (集點卡). Ticket faces keep their own paper colours in both themes. */
:root{
  --desk:#D5DBD7; --desk-2:#C9D0CC; --fg:#1F2422; --muted:#56605A; --line:#1F2422; --card:#FFFDF8;
  --a:#D63A2F; --b:#2457C5; --ok:#1C8648; --amber:#C27410; --void:#7A827E;
  --display:"Huninn","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#191D1B; --desk-2:#222825; --fg:#ECEFEA; --muted:#9AA39D; --line:#ECEFEA; --card:#252A28; --void:#8E9692; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#191D1B; --desk-2:#222825; --fg:#ECEFEA; --muted:#9AA39D; --line:#ECEFEA; --card:#252A28; --void:#8E9692; color-scheme:dark}

html,body{height:100%}
body{background-color:var(--desk);background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--desk-2) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--desk-2) 23px 24px);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--b);outline-offset:2px}

.screen{height:100%;box-sizing:border-box;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
.meta{font-size:.82rem;color:var(--muted)}
.lab{display:block;font-size:.78rem;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}

/* ---------- tickets: a solid card with big, clear text; the stub on the right carries the ticket-type details ---------- */
.tkw{position:relative;width:100%;max-width:360px;font-size:17px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.12)) drop-shadow(0 12px 14px rgba(0,0,0,.18));transform:rotate(var(--tilt,0deg))}
.tk{position:relative;box-sizing:border-box;display:flex;min-height:9.2em;background:var(--t-bg);color:var(--t-fg);border-radius:12px;overflow:hidden;--nx:4.4em}
.notch{-webkit-mask:radial-gradient(circle at calc(100% - var(--nx)) 0,#0000 .6em,#000 calc(.6em + .5px)) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - var(--nx)) 100%,#0000 .6em,#000 calc(.6em + .5px)) bottom/100% 51% no-repeat;mask:radial-gradient(circle at calc(100% - var(--nx)) 0,#0000 .6em,#000 calc(.6em + .5px)) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - var(--nx)) 100%,#0000 .6em,#000 calc(.6em + .5px)) bottom/100% 51% no-repeat}
.tk .main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.45em;padding:1em .9em 1em 1.15em}
.tk-k{font-size:.64em;letter-spacing:.2em;opacity:.72}
.tk .q{font-family:var(--display);font-size:1.45em;line-height:1.36;margin:0;text-wrap:balance}
.stub{width:var(--nx);flex:none;box-sizing:border-box;background:var(--s-bg,var(--t-bg));color:var(--s-fg,var(--t-fg));border-left:2px dashed color-mix(in srgb,var(--t-fg) 35%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;text-align:center;padding:.6em .2em}
.stub small{font-size:.56em;letter-spacing:.14em;opacity:.85;white-space:nowrap}
.stub b{font-family:var(--mono);font-weight:500;font-size:.9em;line-height:1.1}
.stub .big{font-family:var(--display);font-size:1.5em;line-height:1.1}
.stub .lvl{font-size:.62em;letter-spacing:.06em;margin-top:.2em}
.t-rc{--t-bg:#FFFFFF;--t-fg:#232323;--s-bg:#F1EEE8;--s-fg:#C8352B}
.t-mv{--t-bg:#A3262A;--t-fg:#FFF3E2;--s-bg:#F2E4C6;--s-fg:#A3262A}
.t-bp{--t-bg:#1F4E9C;--t-fg:#FFFFFF;--s-bg:#FFFFFF;--s-fg:#1F4E9C}
.t-tr{--t-bg:#F3D2A6;--t-fg:#4A2810;--s-bg:#4A2810;--s-fg:#F3D2A6}
.t-am{--t-bg:#FFB8CC;--t-fg:#4A0E25;--s-bg:#FFE8EF;--s-fg:#C2185B}
.t-cc{--t-bg:#18181E;--t-fg:#FFFFFF;--s-bg:linear-gradient(160deg,#FF9ACB,#FFE27A 35%,#8FF5DC 65%,#A9B4FF);--s-fg:#18181E}
.t-pc{--t-bg:#FBF6EA;--t-fg:#2B2A28;--s-bg:#FBF6EA;--s-fg:#C8352B}
.t-pc .main{border-left:.4em solid;border-image:repeating-linear-gradient(-45deg,#C8352B 0 .5em,#FBF6EA .5em 1em,#2A5CB8 1em 1.5em,#FBF6EA 1.5em 2em) 1}
.t-hk{--t-bg:#1A1A2E;--t-fg:#F3E6C4;--s-bg:#C9A24E;--s-fg:#1A1A2E}
.pcs{width:1.9em;height:2.2em;background:#E9604A;color:#FFF3E6;display:flex;align-items:center;justify-content:center;outline:.18em dotted var(--t-bg);outline-offset:-.1em}

/* 證書與散場 */
.t-cert{--t-bg:#FFFBEF;--t-fg:#3A2A10;--t-acc:#B8913E}
.t-void{--t-bg:#E7E9E8;--t-fg:#3D4441;--t-acc:#7A827E}
.t-cert.tk,.t-void.tk{display:block;min-height:0;padding:1.1em;text-align:center}
.t-cert.tk{border:.3em double var(--t-acc)}
.t-void.tk{border:2px dashed #9AA19D}
.t-cert .q,.t-void .q{font-size:1.5em}
.cert-k{font-size:.7em;letter-spacing:.3em;color:var(--t-acc)}
.cert-list{list-style:none;margin:.5em 0 0;padding:0;font-size:.82em;display:flex;flex-direction:column;gap:.2em}

/* ink stamps */
.ink{position:absolute;left:50%;top:44%;z-index:3;padding:.15em .6em;font-family:var(--display);font-size:1.6em;letter-spacing:.08em;border:.14em solid currentColor;border-radius:.35em;transform:translate(-50%,-50%) rotate(-14deg);opacity:0;pointer-events:none;background:color-mix(in srgb,currentColor 8%,transparent);white-space:nowrap}
.ink.round{border-radius:50%;width:3.6em;height:3.6em;padding:0;display:flex;align-items:center;justify-content:center;border-style:double;border-width:.24em}
.ink.c-red{color:#D63A2F} .ink.c-blue{color:#2457C5} .ink.c-gray{color:#6F7773} .ink.c-amber{color:#C27410} .ink.c-green{color:#1C8648}
.t-hk~.ink.c-gray,.t-cc~.ink.c-gray{color:#B9C0BC}
.t-hk~.ink.c-red,.t-cc~.ink.c-red{color:#FF6F61}
.t-hk~.ink.c-blue,.t-cc~.ink.c-blue{color:#7FA6FF}
.ink.on{opacity:.92;animation:thump .32s cubic-bezier(.2,1.6,.5,1)}
.ink.corner{left:auto;top:-.4em;right:-.4em;font-size:1.1em;transform:rotate(14deg)}
.ink.corner.on{animation:none}
.t-mv .stub .num{font-size:.55em}
@keyframes thump{from{transform:translate(-50%,-50%) rotate(-14deg) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.92}}

/* ---------- play ---------- */
.play{height:100%;display:grid;grid-template-rows:1fr auto 1fr;overflow:hidden}
.half{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;overflow:hidden;padding-block:8px;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
#hA{--pc:var(--a);--tilt:-1.2deg}
#hB{--pc:var(--b);--tilt:1.2deg}
.face #hB{transform:rotate(180deg)}
.who{width:100%;max-width:360px;display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.who b{color:var(--pc);font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:0}
.tkw[data-card]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tkw.back{transition:transform .3s cubic-bezier(.3,1.5,.6,1)}
.tkw.fly{transition:transform .25s ease-in,opacity .25s ease-in}
.tkw.down .tk{filter:saturate(.35) brightness(.92)}
.mini{display:flex;gap:8px}
.tkw.rv{cursor:pointer}
.nx{position:relative;width:46px;height:46px;flex:none;border-radius:50%;background:var(--card);color:var(--fg);font-size:1.6rem;line-height:44px;text-align:center}
.nx svg{position:absolute;inset:0;transform:rotate(-90deg)}
.nx circle{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-dasharray:126;stroke-dashoffset:126;animation:ring var(--auto,3s) linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.pk{font-style:normal;font-weight:700;font-size:.95rem;width:1.1em;text-align:center;animation:thump2 .4s cubic-bezier(.2,1.6,.5,1)}
.pka{color:var(--a)} .pkb{color:var(--b)}
.hint{position:absolute;z-index:0;font-size:.74rem;letter-spacing:.18em;color:var(--fg);opacity:.32;padding:10px 3px;transition:opacity .15s}
.hint:active{opacity:.7}
.h0,.h2{top:50%;transform:translateY(-50%);writing-mode:vertical-rl;text-orientation:upright}
.h0{left:2px} .h2{right:2px}
.h1{bottom:0;left:50%;transform:translateX(-50%);letter-spacing:.12em;padding:4px 12px;white-space:nowrap}
.mb{padding:5px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:.85rem}
.mb2{background:var(--pc,var(--a));border-color:var(--pc,var(--a));color:#fff}
.link{font-size:.82rem;color:var(--muted);text-decoration:underline}
.say{margin:0;text-align:center;font-size:.88rem;max-width:360px}
.say b{font-family:var(--display);font-weight:400;font-size:1.05rem;margin-right:6px}
.pa{color:var(--a)} .pb{color:var(--b)}
.next{background:var(--fg);color:var(--desk);padding:6px 26px;border-radius:999px;font-family:var(--display);font-size:1.02rem}
.ask{font-family:var(--display);font-size:1.1rem;margin:0;text-align:center}
.hand{display:flex;gap:10px;justify-content:center;width:100%;max-width:350px}
.rc{flex:1;min-width:0;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:12px 8px;text-align:center;background:var(--t-bg);color:var(--t-fg);border-radius:8px;outline:1.5px dashed color-mix(in srgb,var(--t-fg) 35%,transparent);outline-offset:-6px;box-shadow:0 10px 16px -10px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));transition:transform .15s}
.rc:nth-child(1){--r:-6deg} .rc:nth-child(3){--r:6deg}
.rc:active{transform:translateY(-8px) rotate(var(--r,0deg))}
.rc small{font-size:.66rem;letter-spacing:.2em;color:var(--t-acc)}
.rc b{font-family:var(--display);font-weight:400;font-size:1.1rem;line-height:1.3}
.rc span{font-size:.72rem;opacity:.8}

/* progress strip: symbols only, so both players read it the same way */
.mid{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-block:4px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(transparent calc(50% - .5px),color-mix(in srgb,var(--fg) 18%,transparent) calc(50% - .5px) calc(50% + .5px),transparent 0)}
.ic{width:30px;height:30px;border-radius:50%;font-size:.9rem;color:var(--muted);background:var(--desk);border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);flex:none}
.punch{display:flex;align-items:center;gap:10px;padding:3px 10px;border-radius:999px;background:var(--desk)}
.slots,.voids{display:flex;gap:5px}
.slot{width:12px;height:12px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--fg) 30%,transparent);flex:none;font-size:0}
.slot.on{border-color:var(--a);background:var(--a)}
.slot.new,.vd.new{animation:thump2 .45s cubic-bezier(.2,1.6,.5,1)}
.vd{width:8px;height:12px;border-radius:2px;border:1.5px solid color-mix(in srgb,var(--fg) 30%,transparent);flex:none;font-size:0}
.vd.on{border-color:var(--void);background:linear-gradient(135deg,transparent 42%,var(--desk) 42% 58%,transparent 58%),var(--void)}
@keyframes thump2{from{transform:scale(2.2)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.ink.on,.slot.on{animation:none}.tkw.back,.tkw.fly{transition:none}}
@media (max-height:760px){.tkw{font-size:15px}.half{gap:8px}}
@media (max-height:680px){.tkw{font-size:13.5px}}

/* ---------- home ---------- */
.hero{--t-bg:#C8352B;--t-fg:#FFF4E4;--t-acc:#FFD9A8;--nx:5.6em;font-size:17px;filter:drop-shadow(0 14px 16px rgba(0,0,0,.22));transform:rotate(-1.5deg);margin-top:6px}
.hero{display:flex}
.hero .tk{flex:1;min-width:0;display:flex;--nx:0px;border-radius:12px 0 0 12px}
.hero>.stub{border-radius:0 12px 12px 0;-webkit-mask:radial-gradient(circle at 0 0,#0000 .6em,#000 calc(.6em + .5px)) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 .6em,#000 calc(.6em + .5px)) bottom/100% 51% no-repeat;mask:radial-gradient(circle at 0 0,#0000 .6em,#000 calc(.6em + .5px)) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 .6em,#000 calc(.6em + .5px)) bottom/100% 51% no-repeat}
.hero .main{flex:1;min-width:0;padding:1.1em 1em 1.1em 1.3em}
.hero-k{font-family:var(--mono);font-size:.7em;letter-spacing:.22em;color:var(--t-acc)}
.hero h1{font-family:var(--display);font-weight:400;font-size:2.6em;white-space:nowrap;line-height:1.05;margin:.12em 0 .25em;letter-spacing:.04em}
.hero p{margin:0;font-size:1em;line-height:1.6}
.hero-fine{display:block;margin-top:.9em;padding-top:.6em;border-top:1px dashed rgba(255,244,228,.35);font-size:.68em;letter-spacing:.12em;opacity:.8}
.hero .stub{background:#FFF4E4;color:#C8352B;border-left:2px dashed rgba(200,53,43,.5);gap:.35em}
.hero .stub b{font-family:var(--display);font-weight:400;font-size:1.35em;line-height:1.2}
.hero .stub small{font-size:.66em;color:#8A4A3A}
.hero .stub:disabled{opacity:1;color:#8A4A3A}
.notice{margin:0;padding:12px 14px;border-radius:10px;background:var(--card);border:1.5px dashed var(--line);font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);padding:12px;border-radius:12px;font-weight:500}
.ghost b{font-family:var(--mono);font-weight:500;font-size:.85rem;background:var(--a);color:#fff;border-radius:999px;padding:0 8px}
.home{min-height:100%;justify-content:center}
.recent{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px 6px}
.recent-h{display:flex;justify-content:space-between;align-items:baseline}
.recent-h .lab{margin:0}
.ri{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.ri:first-of-type{border-top:0}
.ri i{width:.5rem;height:1.6rem;border-radius:3px;background:var(--t-bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mode{display:flex;flex-direction:column;gap:3px;padding:10px 10px 9px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.mode b{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.2}
.mode span{font-size:.72rem;color:var(--muted);line-height:1.4}
.mode[aria-pressed="true"]{background:var(--fg);color:var(--desk)}
.mode[aria-pressed="true"] span{color:inherit;opacity:.75}
.mode.love[aria-pressed="true"]{background:#E04F7C;border-color:#E04F7C;color:#fff}
.mode{padding:9px 8px 8px}
.mode b{font-size:1.02rem}
.mode span{font-size:.66rem}
.t-lt{--t-bg:#FBD3DF;--t-fg:#5C1733;--s-bg:#E04F7C;--s-fg:#FFFFFF}
.mode.spicy[aria-pressed="true"]{background:#1A1A2E;border-color:#1A1A2E;color:#F3E6C4}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;border-radius:999px;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.seg button{padding:7px 4px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg-d{margin:6px 0 0;font-size:.78rem;color:var(--muted);text-align:center}
.hero.go{cursor:pointer;transition:transform .15s}
.hero.go:active{transform:rotate(-1.5deg) scale(.98)}
.hero>.stub{transform-origin:0 0}
.hero.tearing>.stub{animation:tear .6s cubic-bezier(.45,0,.8,.5) forwards}
@keyframes tear{0%{transform:none}25%{transform:rotate(-7deg)}45%{transform:translate(6px,6px) rotate(-15deg)}100%{transform:translate(46px,150px) rotate(-28deg);opacity:0}}
.hero.tearing .main{animation:tug .25s ease-out}
@keyframes tug{30%{transform:translateX(-4px)}100%{transform:none}}
.cgs{display:flex;flex-direction:column;gap:14px}
.cg{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chip.g,.chip.g[aria-pressed]{font-family:var(--display);font-size:1rem;background:none;color:var(--fg);border:0;padding:0}
.chip.g::after{content:"全選";margin-left:8px;font-family:var(--body);font-size:.72rem;color:var(--muted);text-decoration:underline}
.chip.g[aria-pressed="true"]::after{content:"全部關閉"}
.chip.g small{margin-left:6px;font-size:.75em;opacity:.7}
.chip.s{font-size:.8rem;padding:2px 10px}
.slot.vx{border-color:var(--void);background:linear-gradient(135deg,transparent 42%,var(--desk) 42% 58%,transparent 58%),var(--void)}
.slot.nt{border-color:transparent;background:color-mix(in srgb,var(--fg) 28%,transparent)}
.sum{width:100%;max-width:360px;max-height:100%;min-height:0;display:flex;flex-direction:column;gap:8px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline}
.sum-h b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.sum-h span{font-size:.85rem;color:var(--muted)}

function startMix(){
  const all=pool(),fresh2=shuffle(all.filter(q=>!S.answers[q.id])),deck=(fresh2.length?fresh2:shuffle(all)).slice(0,MIX_N);
  if(!deck.length){notice='這個情境沒有題目，先到設定打開一些分類。';show('home');return}
  const idx=deck.map((_,i)=>i),ord=[shuffle(idx),shuffle(idx)];
  if(deck.length>1&&ord[0].join()===ord[1].join())ord[1].push(ord[1].shift());
  mix={deck,ord,pos:[0,0],ans:deck.map(()=>[null,null])};
  phase='mix';cur=null;show('play');
}
function chooseMix(p,v){
  const i=mix.ord[p][mix.pos[p]];
  if(i==null)return;
  mix.ans[i][p]=v;mix.pos[p]++;
  const a=mix.ans[i];
  if(a[0]!=null&&a[1]!=null){
    S.answers[mix.deck[i].id]=[...a];save();
    const r=verdict(a);
    if(r.pt>0)stamps++;else if(r.pt<0)voids++;
    newIdx=i;
  }
  const end=k=>mix.pos[k]>=mix.deck.length;
  if(end(0)&&end(1)){paintHalf(0);paintHalf(1);sfx('win');announce('兩個人都滑完了，對答案')}else paintHalf(p);
  paintMid();
}

  const rows=mix.deck.map((q,i)=>({q,a:mix.ans[i],v:verdict(mix.ans[i])})).sort((x,y)=>y.v.pt-x.v.pt);

// 音效用 Web Audio 現場合成，不需要音檔；震動只有支援的手機（多為 Android）才有
let AC=null,OUT=null;
function sfx(kind){
  if(!S.sound)return;
  navigator.vibrate?.({cut:8,tear:12,stamp:15,match:[18],void:30,win:[15,60,15]}[kind]);
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.3;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;OUT.connect(lp).connect(AC.destination)}
    const t0=AC.currentTime;
    // 紙張、印章的質感：濾過的雜訊＋低頻悶響，不用旋律音
    const noise=(dur,freq,q,vol,at=0)=>{const n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol;src.connect(f).connect(g).connect(OUT);src.start(t0+at)};
    const thud=(f1,f2,dur,vol,at=0)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+at;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(OUT);o.start(t);o.stop(t+dur)};
    if(kind==='cut')noise(.06,3200,.9,.5);
    else if(kind==='tear'){noise(.28,2200,.5,.35);noise(.12,4200,1.2,.2,.12)}
    else if(kind==='stamp'){thud(110,50,.12,.35);noise(.04,900,1,.25)}
    else if(kind==='match'){thud(120,45,.16,.5);noise(.05,800,.9,.35)}
    else if(kind==='void'){thud(80,55,.14,.25);noise(.1,350,.7,.3)}
    else if(kind==='win'){thud(120,45,.16,.45);noise(.05,800,.9,.3);thud(120,45,.16,.45,.2);noise(.05,800,.9,.3,.2)}
  }catch{}
}

const dirOf=(dx,dy,t)=>Math.abs(dx)>=t&&Math.abs(dx)>dy?(dx>0?2:0):dy>=t&&dy>Math.abs(dx)?1:null;
function bindCard(p){

  if(!el)return;
  const sign=S.face&&p===1&&!solo()?-1:1,T=80,[s2,s0,s1]=el.querySelectorAll('.ink');
  let id=null,x0=0,y0=0,dx=0,dy=0;
  const reset=()=>{el.classList.add('back');el.style.transform='';s2.style.opacity=s0.style.opacity=s1.style.opacity=0};
  el.addEventListener('pointerdown',e=>{
    if(id!==null)return;
    id=e.pointerId;x0=e.clientX;y0=e.clientY;dx=dy=0;
    el.setPointerCapture(id);el.classList.remove('back');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    dx=(e.clientX-x0)*sign;dy=(e.clientY-y0)*sign;
    el.style.transform=`translate(${dx}px,${Math.max(dy,-24)}px) rotate(${dx/14}deg)`;
    const h=Math.abs(dx)>dy;
    s2.style.opacity=h&&dx>0?Math.min(.92,dx/T):0;
    s0.style.opacity=h&&dx<0?Math.min(.92,-dx/T):0;
    s1.style.opacity=!h&&dy>0?Math.min(.92,dy/T):0;
  });
  el.addEventListener('pointerup',e=>{
    if(e.pointerId!==id)return;
    id=null;
    const v=dirOf(dx,dy,T);
    if(v==null)return reset();
    el.classList.add('fly');
    el.style.transform=v===1?`translate(${dx}px,520px)`:`translate(${v?520:-520}px,${dy}px) rotate(${v?28:-28}deg)`;

  const full=trOne(t,D);
  if(full!=null)return full;
  // 有設名字時，先換回「對方／玩家一／玩家二」查表，再把名字放回去
  for(const n of S.names.map(x=>(x||'').trim()).filter(Boolean))for(const sub of ['對方','玩家一','玩家二']){
    if(!t.includes(n))continue;
    const h=trOne(t.split(n).join(sub),D);
    if(h!=null)return h.split(D.ui[sub]||sub).join(n);
  }
  // 「A・B・C」這類組合字，逐段翻
  if(/[・｜]/.test(t))return t.split(/([・｜])/).map(x=>/[・｜]/.test(x)?(l==='ja'?'・':' · '):CJK.test(x)?(trOne(x.trim(),D)??x):x).join('');
  return t;
}
function trNode(root){
  if(S.lang==='zh'&&(!S.lang2||S.lang2==='zh'))return;
  const at=n=>n.closest?.('[data-lang]')?.dataset.lang||S.lang;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  for(let n=root;n;n=w.nextNode()){
    if(n.nodeType===3){
      const pn=n.parentNode;
      if(!pn||/SCRIPT|STYLE/.test(pn.nodeName)||pn.closest?.('#lang,.nolang'))continue;
      const v=n.nodeValue,t=v.trim();
      if(t&&CJK.test(t)){const r=tr(t,at(pn));if(r!==t)n.nodeValue=v.replace(t,r)}
    }else if(n.nodeType===1&&!n.closest('#lang,.nolang'))for(const a of ['aria-label','placeholder','title']){const v=n.getAttribute(a);if(v&&CJK.test(v))n.setAttribute(a,tr(v,at(n)))}
  }
}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
function applyLang(){
  const D=DICT();
  for(const q of Q){q.zh??=q.t;q.t=D?.q[q.id]||q.zh}
  for(const c of CATS){c.zh??=c.name;c.name=D?.c[c.id]||c.zh}
  for(const g of GROUPS){g.zh??=g.name;g.name=D?.g[g.id]||g.zh}
  document.documentElement.lang={zh:'zh-Hant',en:'en',ja:'ja',ko:'ko'}[S.lang];
  document.title=D?.ui['互動門票']||'互動門票';
}
function loadLang(done){
  if(S.lang2===S.lang)S.lang2=null;
  const need=[S.lang,S.lang2].find(l=>l&&l!=='zh'&&!window.I18N?.[l]);
  if(!need)return done();
  const sc=document.createElement('script');
  sc.src=`i18n/${need}.js`;sc.onload=()=>loadLang(done);sc.onerror=()=>{if(need===S.lang)S.lang='zh';else S.lang2=null;loadLang(done)};
  document.head.appendChild(sc);
}
document.addEventListener('change',e=>{if(e.target.id==='lang'){S.lang=e.target.value;save();loadLang(()=>{applyLang();render();trNode(document.body)})}});
document.documentElement.classList.add('i18n-wait');
loadLang(()=>{applyLang();render();trNode(document.body);document.documentElement.classList.remove('i18n-wait');
  const rm=new URLSearchParams(location.search).get('room');
  if(/^\d{4}$/.test(rm||'')){history.replaceState(null,'',location.pathname);openNet(rm)}
});
</script>
